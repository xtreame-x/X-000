# ══════════════════════════════════════════════════════════════════════════════
#  ORYN — Master Configuration
# ══════════════════════════════════════════════════════════════════════════════

ai:
  # Primary provider: gemini | groq | openrouter | nvidia | ollama
  provider: gemini
  model: gemini-3.5-flash-lite
  coding_provider: gemini
  coding_model: gemini-3.5-flash-lite
  max_tokens: 1500
  temperature: 0.7

  # Fallback chain (tried in order if primary fails)
  fallback:
    - provider: groq
      model: openai/gpt-oss-120b
    - provider: openrouter
      model: anthropic/claude-3.5-sonnet

memory:
  stm_word_limit: 80
  compress_trigger: 60

hotkey:
  aris: ctrl+alt+0
  voice: ctrl+alt+v

location:
  city: Delhi
  country: India

search:
  enabled: true
  max_results: 5

voice:
  stt_enabled: true
  tts_enabled: true
  whisper_model: tiny
  tts_rate: 175
  tts_voice: 0
  listen_duration: 5

plugins:
  enabled: true
  folder: plugins

update:
  check_on_start: true
  repo: jaya-prakash1123/none

logging:
  enabled: true
  level: INFO
  max_size_mb: 5
  backup_count: 3
