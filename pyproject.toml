[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openagent"
version = "0.1.0"
description = "A self-modifying agentic AI runtime with 303 tools, cross-platform (Windows-first)."
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
openagent = "agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
